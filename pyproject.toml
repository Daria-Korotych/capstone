[project]
name = "kv"
version = "0.1.0"
description = "Light DynamoDB-like key-value store: coordinator and shards"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "cfn-flip",
    "cfn-lint",
    "openapi-spec-validator",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
